<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanchonete do jegue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Digite um codigo valido</h1>
    <p>Codigo valido.</p>

    <div>
        <label for="codigo">Codigo do produto comprado: </label>
        <input type="number" id="codigo" placeholder="Digite o codigo aqui">

        <label for="quantidade">Quantidade comprada: </label>
        <input type="number" id="quantidade" placeholder="Digite a quantidade que comprou: ">
        
    </div>

    <button>Calcular</button>

    <p id="resultado"></p>

    <script src="script.js"></script>
</body>
</html>
